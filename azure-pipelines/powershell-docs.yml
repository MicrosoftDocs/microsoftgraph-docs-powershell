# If you are not using the E+D shared hosted pool with windows-2022, replace the pool section with your hosted pool, os, and image name. If you are using a Linux image, you must specify an additional windows image for SDL: https://eng.ms/docs/cloud-ai-platform/devdiv/one-engineering-system-1es/1es-docs/1es-pipeline-templates/features/sdlanalysis/overview#how-to-specify-a-windows-pool-for-the-sdl-source-analysis-stage
# The Task 'PublishBuildArtifacts@1' has been converted to an output named 'Publish Examples to be reviewed as artifact' in the templateContext section.
# The generation pipeline is split into two independent stages: one for the v1.0
# profile (which also owns the Microsoft.Graph.Authentication module) and one for
# the beta profile. Each stage generates, post-processes, pushes, and opens its own
# pull request so the v1.0 and beta refreshes can be reviewed separately.
trigger: none
pr: none
name: 'PowerShellDocsUpdate Check'
schedules:
- cron: "0 3 * * FRI"
  displayName: 'PowerShellDocsUpdate Check'
  branches:
    include:
    - main
  always: true
parameters:
- name: PipelineTimeout
  displayName: PipelineTimeout
  type: number
  default: 1200
- name: CreatePullRequest
  type: boolean
  default: true
resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
variables:
  buildConfiguration: 'Release'
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool: 
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-2022
      os: windows
    sdl:
      credscan:
        suppressionsFile: $(Build.SourcesDirectory)/azure-pipelines/config/credscan/credscan-suppressions.json
      policheck:
        exclusionFile: $(Build.SourcesDirectory)/azure-pipelines/config/policheck/policheck-exclusions.xml
      sourceRepositoriesToScan:
        exclude:
          - repository: msgraph-sdk-powershell
    customBuildTags:
    - ES365AIMigrationTooling
    stages:
    - stage: v1
      displayName: 'Generate v1.0 docs'
      jobs:
      - job: PowerShellDocsUpdateV1
        displayName: 'Generate v1.0 reference docs'
        timeoutInMinutes: ${{ parameters.PipelineTimeout }}
        templateContext:
          outputs:
          - output: pipelineArtifact
            displayName: 'Publish Examples to be reviewed as artifact (v1.0)'
            targetPath: missingexternaldocsurl
            artifactName: 'MissingExternalDocs-v1.0'
            publishLocation: 'Container'
        steps:
        - template: azure-pipelines/common-templates/generate-docs-steps.yml@self
          parameters:
            GraphProfile: 'v1.0'
            BranchPrefix: 'WeeklyReferenceDocsUpdate-v1.0'
            BaseBranch: 'main'
            PrTitle: 'Weekly PowerShell Microsoft Graph v1.0 Reference Docs Refresh'
            PrBody: 'This pull request was automatically created by Azure Pipelines and refreshes the v1.0 reference docs (including the Microsoft.Graph.Authentication module). **Important** Check for unexpected deletions or changes in this PR.'
    - stage: beta
      displayName: 'Generate beta docs'
      dependsOn: []
      jobs:
      - job: PowerShellDocsUpdateBeta
        displayName: 'Generate beta reference docs'
        timeoutInMinutes: ${{ parameters.PipelineTimeout }}
        templateContext:
          outputs:
          - output: pipelineArtifact
            displayName: 'Publish Examples to be reviewed as artifact (beta)'
            targetPath: missingexternaldocsurl
            artifactName: 'MissingExternalDocs-beta'
            publishLocation: 'Container'
        steps:
        - template: azure-pipelines/common-templates/generate-docs-steps.yml@self
          parameters:
            GraphProfile: 'beta'
            BranchPrefix: 'WeeklyReferenceDocsUpdate-beta'
            BaseBranch: 'main'
            PrTitle: 'Weekly PowerShell Microsoft Graph beta Reference Docs Refresh'
            PrBody: 'This pull request was automatically created by Azure Pipelines and refreshes the beta reference docs. **Important** Check for unexpected deletions or changes in this PR.'
