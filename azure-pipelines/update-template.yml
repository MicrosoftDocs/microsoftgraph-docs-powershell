parameters:
  # Which SDK profile to install for. "both" preserves the original full-run behaviour and
  # installs the Microsoft.Graph and Microsoft.Graph.Beta meta modules.
  - name: InstallProfile
    type: string
    default: both
  # When set, only the single workload submodule for that module (plus Authentication) is
  # installed instead of the whole SDK. This keeps each isolated per-module stage fast and
  # guarantees only one workload module is ever present in the session.
  - name: Module
    type: string
    default: ""

steps:
- task: PowerShell@2
  displayName: Install Required Modules
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
          # Register the central CFS feed (network-isolation compliance) and install the SDK modules from it.
          $token = ConvertTo-SecureString "$env:SYSTEM_ACCESSTOKEN" -AsPlainText -Force
          $cred = [System.Management.Automation.PSCredential]::new("azure", $token)
          $feedUrl = "https://microsoftgraph.pkgs.visualstudio.com/0985d294-5762-4bc2-a565-161ef349ca3e/_packaging/PowerShell_V2_Build/nuget/v2"
          if (-not (Get-PSRepository -Name PowerShell_V2_Build -ErrorAction SilentlyContinue)) {
              Register-PSRepository -Name PowerShell_V2_Build -SourceLocation $feedUrl -InstallationPolicy Trusted -Credential $cred
          }

          $installProfile = "${{ parameters.InstallProfile }}"
          $module = "${{ parameters.Module }}"

          # Build the list of modules to install.
          $toInstall = @()
          if ([string]::IsNullOrWhiteSpace($module)) {
              # Full-run behaviour: install the meta module(s) for the requested profile(s).
              if ($installProfile -ne 'v1.0') { $toInstall += 'Microsoft.Graph.Beta' }
              if ($installProfile -ne 'beta') { $toInstall += 'Microsoft.Graph' }
          }
          else {
              # Isolated per-module run: install only Authentication + the single workload
              # submodule for the target profile.
              $toInstall += 'Microsoft.Graph.Authentication'
              if ($installProfile -eq 'beta') {
                  $toInstall += "Microsoft.Graph.Beta.$module"
              }
              else {
                  $toInstall += "Microsoft.Graph.$module"
              }
          }

          foreach ($m in $toInstall) {
              try {
                  Install-Module $m -Repository PowerShell_V2_Build -Credential $cred -Scope AllUsers -AcceptLicense -SkipPublisherCheck -Force -AllowClobber
              }
              catch {
                  # Do not fail the install step; a missing/failed module surfaces later as a
                  # fail-safe (no deletion, no PR) in the isolated generation stage.
                  Write-Host "##vso[task.logissue type=warning]Failed to install $m : $($_.Exception.Message)"
              }
          }

          $modules = Get-Module -Name Microsoft.Graph* -ListAvailable
          foreach($r in $modules)
          {
            echo "$($r.Name) $($r.Version)"
          }
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)

- template: checkout.yml